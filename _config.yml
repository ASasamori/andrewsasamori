title: Andrew Sasamori
description: Andrew Sasamori's portfolio and notes.
url: "https://andrewsasamori.org"
baseurl: ""
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note

exclude:
  - .archive
  - app
  - content
  - data
  - dist
  - middleware.ts
  - next-env.d.ts
  - node_modules
  - package.json
  - pnpm-lock.yaml
  - postcss.config.js
  - scripts
  - site
  - tools
  - tsconfig.json
  - tsconfig.tsbuildinfo
  - vercel.json
