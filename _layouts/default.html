<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} — {% endif %}Andrew Sasamori</title>
    <link rel="icon" href="{{ '/public/icons/vibe.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <p class="site-title"><a href="{{ '/' | relative_url }}">Andrew Sasamori</a></p>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/blogs/' | relative_url }}">blogs</a>
        </nav>
      </header>

      {{ content }}

    </div>
  </body>
</html>
